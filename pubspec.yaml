name: mamata_app
description: A new Flutter project.
publish_to: 'none' 

version: 1.0.0+1

environment:
   sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^12.0.0
  url_launcher: ^6.1.10
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

  flutter_secure_storage: ^9.2.4
  get: ^4.6.5
  table_calendar: ^3.0.9
  intl: ^0.20.2
  device_calendar: ^4.3.2  
  permission_handler: ^11.0.1 
  nepali_date_picker: ^6.0.2
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_slidable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 

flutter:
  uses-material-design: true
  assets:
    - assets/hospitals.json 
    - assets/pregnancy_exercises.json
    - assets/pregnancy_nutrition.json
    - assets/pregnancy_weeks_info.json
    - assets/week_images.json
    - assets/baby_size_week.json

 
